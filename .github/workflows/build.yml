name: Gerar APK ANTENA CONTROL

on:
  workflow_dispatch:
  push:
    branches: [ "main", "principal" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Instalar plataforma Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto Android
        run: |
          test -f ANTENA_CONTROL_CLOUD_BUILD.zip || { echo "Arquivo ANTENA_CONTROL_CLOUD_BUILD.zip não encontrado na raiz do repositório."; exit 1; }
          mkdir -p projeto
          unzip -q ANTENA_CONTROL_CLOUD_BUILD.zip -d projeto
          find projeto -maxdepth 5 -type f | sort | head -100

      - name: Localizar projeto Gradle
        run: |
          SETTINGS_FILE="$(find projeto \( -name settings.gradle -o -name settings.gradle.kts \) -type f | head -1)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Não encontrei settings.gradle dentro do ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Compilar APK de depuração
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ANTENA-CONTROL-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
